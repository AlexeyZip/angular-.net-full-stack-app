name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: true
  NX_DAEMON: false
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  frontend:
    name: Frontend (lint, unit tests, both builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10.9.0 fails to install this lockfile (see docs/project/KNOWN_ISSUES.md).
      - run: npm install -g npm@11
      - run: npm ci --no-audit --no-fund
      - run: npx nx run-many -t lint test
      - name: Build Signals variant
        run: npx nx run web:build:production
      - name: Build NgRx variant
        run: npx nx run web:build:production-ngrx
      - name: Signals bundle must not contain NgRx
        run: |
          if grep -rl "@ngrx/store" dist/apps/web/browser --include=*.js; then
            echo "NgRx code leaked into the Signals build" && exit 1
          fi

  backend:
    name: Backend (build, unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/api/global.json
      - run: dotnet tool restore
      - run: dotnet build Shop.sln -c Release
      - name: Unit tests
        run: dotnet test --project tests/Shop.Api.UnitTests -c Release --no-build
      # Testcontainers starts a throw-away PostgreSQL in the runner's Docker daemon.
      - name: Integration tests (real PostgreSQL)
        run: dotnet test --project tests/Shop.Api.IntegrationTests -c Release --no-build
      - name: Migrations are in sync with the model
        run: dotnet ef migrations has-pending-model-changes --project src/Shop.Api --no-build --configuration Release

  e2e:
    name: E2E (Playwright, both state variants)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/api/global.json
      - run: npm install -g npm@11
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # The API starts in Development (migrations + seed data) against the service container above.
      - run: npx nx e2e web-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: dist/.playwright/web-e2e
          retention-days: 7
