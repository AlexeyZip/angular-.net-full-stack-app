# Serves only the remote's static bundle. Hosts reach it through their own /mfe/assistant/ proxy location,
# so the browser loads it from the shop's origin and the shop's CSP (script-src 'self') still holds.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types application/javascript;

    # The entry file name is stable (outputHashing: none), so browsers must revalidate it to pick up a redeploy.
    location = /mfe/assistant/main.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
    }

    # Lazy chunks have content-hashed names.
    location /mfe/assistant/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
