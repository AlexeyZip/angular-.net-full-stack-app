server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A local model can need longer than nginx's default 60 s to answer; the API enforces its own timeout.
    location /api/assistant/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
    }

    location /health {
        proxy_pass http://api:8080;
    }

    # The assistant microfrontend is a separate container. Resolving its name per request (variable +
    # Docker's DNS) lets the shop start and work without it: only /mfe/assistant/ then answers 502.
    # ^~ stops the *.js regex location below from serving these paths from the host's own files.
    location ^~ /mfe/assistant/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $assistant_mfe http://assistant-mfe:8080;
        proxy_pass $assistant_mfe;
    }

    # Hashed bundles never change, so they can be cached forever.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the SPA shell, which must never be cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
