# Local development environment (not a production deployment).
#   docker compose up -d postgres            -> database only; run the API and web app natively
#   docker compose --profile full up --build -> database + API + both web variants behind nginx
#                                               + the assistant microfrontend + the notifications
#                                               microservice (http://localhost:5090, internal API):
#        Signals variant: http://localhost:8080    NgRx variant: http://localhost:8081
# All credentials here are development-only placeholders. Override them in a local .env (see .env.example).
name: shop-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["full"]
    build:
      context: ./services/api
      dockerfile: Dockerfile
    # No published port: the API is reachable only through the web containers' reverse proxy,
    # which is what makes trusting X-Forwarded-For safe here.
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Shop: Host=postgres;Port=5432;Database=${POSTGRES_DB:-shop};Username=${POSTGRES_USER:-shop};Password=${POSTGRES_PASSWORD:-shop_dev_password}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-DEV-ONLY-signing-key-do-not-use-in-production-0123456789}
      ReverseProxy__TrustForwardedHeaders: "true"
      Logging__Console__FormatterName: json
      # Raise only for running the E2E suite against the containers (many sign-ins from one IP).
      RateLimiting__AuthPermitLimit: ${API_AUTH_PERMIT_LIMIT:-10}
      RateLimiting__CheckoutPermitLimit: ${API_CHECKOUT_PERMIT_LIMIT:-10}
      RateLimiting__AssistantPermitLimit: ${API_ASSISTANT_PERMIT_LIMIT:-20}
      # Mock by default. ASSISTANT_PROVIDER=OpenAiCompatible uses a model server on the host (Ollama by default).
      Assistant__Provider: ${ASSISTANT_PROVIDER:-Mock}
      Assistant__OpenAiCompatible__BaseUrl: ${ASSISTANT_BASE_URL:-http://host.docker.internal:11434/v1}
      Assistant__OpenAiCompatible__Model: ${ASSISTANT_MODEL:-qwen2.5:7b}
      Assistant__OpenAiCompatible__Timeout: ${ASSISTANT_TIMEOUT:-00:01:30}
      Assistant__OpenAiCompatible__WarmUpOnStart: "true"
      # Order events go through the outbox to the notifications service. No depends_on on purpose:
      # when it is down, checkout still works and events wait in the outbox.
      Notifications__BaseUrl: http://notifications:8080
      Notifications__ServiceKey: ${NOTIFICATIONS_SERVICE_KEY:-DEV-ONLY-notifications-service-key}
    # Lets the API reach a model server on the host on Linux too (Docker Desktop defines it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        WEB_CONFIGURATION: production
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  web-ngrx:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        WEB_CONFIGURATION: production-ngrx
    ports:
      - "127.0.0.1:${WEB_NGRX_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy

  # Microfrontend: no published port and no depends_on from the web containers on purpose. It is reached
  # through their /mfe/assistant/ proxy, and the shop keeps working when it is stopped.
  assistant-mfe:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/assistant-mfe/Dockerfile

  # Microservice with its own database (shop_notifications, created by its migrations on the shared local
  # PostgreSQL server). Internal only: published on 127.0.0.1 for inspecting simulated e-mails.
  notifications:
    profiles: ["full"]
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Notifications: Host=postgres;Port=5432;Database=shop_notifications;Username=${POSTGRES_USER:-shop};Password=${POSTGRES_PASSWORD:-shop_dev_password}
      ServiceAuth__ServiceKey: ${NOTIFICATIONS_SERVICE_KEY:-DEV-ONLY-notifications-service-key}
      Database__ApplyMigrationsOnStartup: "true"
      Logging__Console__FormatterName: json
    ports:
      - "127.0.0.1:${NOTIFICATIONS_PORT:-5090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
